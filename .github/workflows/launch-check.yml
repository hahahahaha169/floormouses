name: Android startup check
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  start-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle --no-daemon :app:assembleDebug
      - name: Launch app in emulator and check crash
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.example.floormouse/.MainActivity
            sleep 6
            adb logcat -d -s AndroidRuntime:E ActivityTaskManager:E | tail -n 160
            adb shell pidof com.example.floormouse || exit 16
            echo "APP_PROCESS_ALIVE"
