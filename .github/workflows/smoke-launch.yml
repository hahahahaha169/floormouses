name: Startup smoke test (Android emulator)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/smoke-launch.yml"
      - "app/src/**"
      - "app/build.gradle.kts"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle --no-daemon :app:assembleDebug
      - name: Install and launch twice on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          script: |
            set -e
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.example.floormouse/.MainActivity
            sleep 8
            echo "First launch process:"
            adb shell pidof com.example.floormouse
            adb shell pm grant com.example.floormouse android.permission.CAMERA
            adb shell pm grant com.example.floormouse android.permission.BLUETOOTH_CONNECT
            adb shell pm grant com.example.floormouse android.permission.BLUETOOTH_ADVERTISE
            adb shell am force-stop com.example.floormouse
            adb logcat -c
            adb shell am start -W -n com.example.floormouse/.MainActivity
            sleep 10
            echo "Permitted launch process:"
            adb shell pidof com.example.floormouse
            if adb logcat -d -s AndroidRuntime:E | grep -A15 "FATAL EXCEPTION"; then
              echo "CRASH FOUND" >&2
              exit 1
            fi
            echo "Startup smoke test PASSED"
